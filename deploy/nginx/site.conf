# cicd.touseefahmed.com: the live status page of the fabric.
# Copied to /etc/nginx/sites-available/cicd.touseefahmed.com by deploy/publish.sh, and certbot then
# adds HTTPS to that copy. The page is served straight from the production checkout, so the agent
# deploys the page and its collector in the same commit; status.json is the collector's output.
server {
    listen 80;
    server_name cicd.touseefahmed.com;

    root /srv/fabric/deploy/web;
    index index.html;

    include /etc/nginx/snippets/fabric-security.conf;   # headers, rate limits, read only

    location = /status.json {
        alias /var/lib/fabric-status/status.json;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

# Security settings for cicd.touseefahmed.com, included by its server block.
# Installed to /etc/nginx/snippets/fabric-security.conf by deploy/publish.sh.

server_tokens off;                                   # "nginx", without the version

# A read only site: anything other than GET and HEAD is refused
if ($request_method !~ ^(GET|HEAD)$) { return 405; }

# Per visitor limits (zones in /etc/nginx/conf.d/fabric-limits.conf).
# The page asks for status.json every 10 s, so 5 requests a second is plenty.
limit_req zone=fabric burst=20 nodelay;
limit_req_status 429;
limit_conn fabric_conn 20;
limit_conn_status 429;

# Browsers always ask whether a file changed (a quick 304 when it did not), so after a deploy
# nobody keeps running the old page against a newer status.json
expires -1;

# Hidden files are never served; Let's Encrypt still works
location ~ /\.(?!well-known/) { deny all; }

# Browser protections. The page has no inline code at all, so the policy can forbid it outright.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

! border2: border leaf. Generated from intent/fabric.yml by fabctl render; do not edit by hand.
frr version 10.2.1
frr defaults datacenter
hostname border2
log syslog informational
service integrated-vtysh-config
!
vrf prod
 vni 50001
 ! Our own address space ends here: a packet for an unused 10.10.0.0/16 address is
 ! dropped, instead of following the default route back to the ISP in a loop.
 ip route 10.10.0.0/16 blackhole
exit-vrf
!
interface lo
 ip address 10.255.0.22/32
exit
!
interface eth1
 description to spine1
exit
!
interface eth2
 description to spine2
exit
!
bfd
 profile FABRIC
  transmit-interval 200
  receive-interval 200
 exit
exit
!
router bgp 65202
 bgp router-id 10.255.0.22
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd
 neighbor FABRIC bfd profile FABRIC
 neighbor eth1 interface peer-group FABRIC
 neighbor eth2 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.255.0.22/32
  neighbor FABRIC route-map LOOPBACKS-ONLY in
  neighbor FABRIC route-map LOOPBACKS-ONLY out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65202 vrf prod
 bgp router-id 10.255.0.22
 bgp bestpath as-path multipath-relax
 neighbor 172.16.255.3 remote-as 64496
 neighbor 172.16.255.3 description isp
 !
 address-family ipv4 unicast
  network 10.10.0.0/16
  neighbor 172.16.255.3 route-map FROM-ISP in
  neighbor 172.16.255.3 route-map TO-ISP out
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map DEFAULT-ONLY
  route-target import 65000:50001
  route-target export 65000:50001
 exit-address-family
exit
!
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.0/24 ge 32
ip prefix-list DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list SUMMARY seq 10 permit 10.10.0.0/16
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
exit
!
! From the ISP: only a default route. Everything else it might send is dropped.
route-map FROM-ISP permit 10
 match ip address prefix-list DEFAULT
exit
!
! To the ISP: only the prod summary. No single servers, no other tenant.
route-map TO-ISP permit 10
 match ip address prefix-list SUMMARY
exit
!
! Into the fabric: only the default route, so every prod leaf can reach the internet.
route-map DEFAULT-ONLY permit 10
 match ip address prefix-list DEFAULT
exit
!

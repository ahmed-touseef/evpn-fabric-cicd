! isp: the upstream provider, simulated. Generated from intent/fabric.yml by fabctl render.
! A real ISP is not ours to configure. This one deliberately accepts whatever the borders
! send, so any leak from our side shows up in its routing table, where the tests look for it.
frr version 10.2.1
frr defaults traditional
hostname isp
log syslog informational
service integrated-vtysh-config
! The container forwards IPv6 too. With traditional defaults FRR lists that in its running
! config, so the rendered config says it as well, or the two would never match.
ipv6 forwarding
!
interface lo
 description the internet, as far as the fabric can tell
 ip address 198.51.100.1/32
exit
!
interface eth21
 description to border1
 ip address 172.16.255.1/31
exit
!
interface eth22
 description to border2
 ip address 172.16.255.3/31
exit
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 172.16.255.0 remote-as 65201
 neighbor 172.16.255.0 description border1
 neighbor 172.16.255.2 remote-as 65202
 neighbor 172.16.255.2 description border2
 !
 address-family ipv4 unicast
  network 198.51.100.1/32
  neighbor 172.16.255.0 default-originate
  neighbor 172.16.255.2 default-originate
 exit-address-family
exit
!

! leaf4: leaf. Generated from intent/fabric.yml by fabctl render; do not edit by hand.
frr version 10.2.1
frr defaults datacenter
hostname leaf4
log syslog informational
service integrated-vtysh-config
!
vrf storage
 vni 50002
exit-vrf
!
interface lo
 ip address 10.255.0.14/32
exit
!
interface eth1
 description to spine1
exit
!
interface eth2
 description to spine2
exit
!
bfd
 profile FABRIC
  transmit-interval 100
  receive-interval 100
 exit
exit
!
router bgp 65104
 bgp router-id 10.255.0.14
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd
 neighbor FABRIC bfd profile FABRIC
 neighbor eth1 interface peer-group FABRIC
 neighbor eth2 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.255.0.14/32
  neighbor FABRIC route-map LOOPBACKS-ONLY in
  neighbor FABRIC route-map LOOPBACKS-ONLY out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
  vni 10020
   route-target import 65000:10020
   route-target export 65000:10020
  exit-vni
  vni 10021
   route-target import 65000:10021
   route-target export 65000:10021
  exit-vni
 exit-address-family
exit
!
router bgp 65104 vrf storage
 bgp router-id 10.255.0.14
 bgp bestpath as-path multipath-relax
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50002
  route-target export 65000:50002
 exit-address-family
exit
!
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.0/24 ge 32
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
exit
!

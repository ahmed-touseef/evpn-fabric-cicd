! spine2: spine. Generated from intent/fabric.yml by fabctl render; do not edit by hand.
frr version 10.2.1
frr defaults datacenter
hostname spine2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
exit
!
interface eth11
 description to leaf1
exit
!
interface eth12
 description to leaf2
exit
!
interface eth13
 description to leaf3
exit
!
interface eth14
 description to leaf4
exit
!
interface eth21
 description to border1
exit
!
interface eth22
 description to border2
exit
!
bfd
 profile FABRIC
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
router bgp 65100
 bgp router-id 10.255.0.2
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd profile FABRIC
 neighbor eth11 interface peer-group FABRIC
 neighbor eth12 interface peer-group FABRIC
 neighbor eth13 interface peer-group FABRIC
 neighbor eth14 interface peer-group FABRIC
 neighbor eth21 interface peer-group FABRIC
 neighbor eth22 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor FABRIC route-map LOOPBACKS-ONLY in
  neighbor FABRIC route-map LOOPBACKS-ONLY out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
 exit-address-family
exit
!
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.0/24 ge 32
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
exit
!

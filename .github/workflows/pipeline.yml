# The pipeline: GitHub runs this on every pull request and on every change to main.
# A red step blocks the merge; nothing reaches the network until every step is green.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  intent:
    name: Intent and configs
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install the tools
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml python3-jinja2 shellcheck

      - name: The intent has no mistakes
        run: python3 -m fabctl check

      - name: The committed configs match the intent
        run: |
          python3 -m fabctl render > /dev/null
          if [ -n "$(git status --porcelain -- rendered/)" ]; then
            git status --short -- rendered/
            echo "::error::rendered/ does not match intent/fabric.yml. Run: python3 -m fabctl render, then commit rendered/"
            exit 1
          fi
          echo "rendered/ is exactly what the intent produces"

      - name: FRR accepts every config
        run: |
          docker pull -q quay.io/frrouting/frr:10.2.1 > /dev/null
          failed=0
          for f in rendered/*/frr.conf; do
            if out=$(docker run --rm -v "$PWD/$f:/tmp/c.conf:ro" -v /dev/null:/etc/frr/vtysh.conf:ro \
                     quay.io/frrouting/frr:10.2.1 vtysh -C -f /tmp/c.conf 2>&1); then
              echo "accepted  $f"
            else
              echo "::error file=$f::FRR rejects this config: $out"
              failed=1
            fi
          done
          exit $failed

      - name: Shell scripts are clean
        run: shellcheck -s sh rendered/*/interfaces.sh && shellcheck lab/deploy.sh && echo "all scripts clean"

  batfish:
    name: Batfish
    needs: intent                 # only analyse configs that already passed the first job
    runs-on: ubuntu-24.04
    services:
      batfish:                    # Batfish runs next to the job, reachable on localhost:9996
        image: batfish/allinone:2025.07.07.2423
        ports:
          - 9996:9996
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -q pyyaml jinja2 pytest pybatfish==2025.7.7.2423

      - name: Build the Batfish snapshot
        run: python3 -m fabctl snapshot

      - name: Batfish proves the configs obey the intent
        run: python3 -m pytest tests/batfish -v --tb=short -p no:cacheprovider

  live:
    name: Live lab
    needs: batfish                # only boot configs that Batfish has already proven
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the tools
        run: |
          pip install -q pyyaml jinja2 pytest
          curl -sSfL -o /tmp/containerlab.deb \
            https://github.com/srl-labs/containerlab/releases/download/v0.79.0/containerlab_0.79.0_linux_amd64.deb
          sudo dpkg -i /tmp/containerlab.deb > /dev/null
          containerlab version

      - name: Kernel features the fabric needs
        run: |
          # VRFs and VXLAN tunnels live in the Linux kernel. Cloud kernels keep some of them
          # in a separate package, so install it only if they are missing.
          if ! sudo modprobe -a vrf vxlan 2>/dev/null; then
            echo "not in the base kernel package: installing the extra kernel modules"
            sudo apt-get update -q > /dev/null
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" > /dev/null
            sudo modprobe -a vrf vxlan
          fi
          echo "kernel $(uname -r): vrf and vxlan loaded"

      - name: Boot the fabric
        run: ./lab/deploy.sh

      - name: The running fabric obeys the intent
        run: python3 -m pytest tests/live -v --tb=short -p no:cacheprovider

      - name: What the fabric looked like, to debug the failure
        if: failure()
        run: python3 ci/live_explore.py
